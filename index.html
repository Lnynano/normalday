<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Normalday — เครื่องคิดเลขและข้อมูลอ้างอิงสำหรับชีวิตประจำวันในไทย" />
    <title>Normalday</title>
    <script>
      // Apply saved theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem('normalday:theme');
        var dark = t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
        var l = localStorage.getItem('normalday:lang');
        if (l === 'en') document.documentElement.lang = 'en';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
